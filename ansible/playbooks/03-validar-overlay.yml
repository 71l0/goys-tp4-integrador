
---
- name: Verificar Headscale y los clientes Tailscale
  hosts: controlador
  connection: local
  gather_facts: false

  vars_files:
    - ../vars/lab.yml

  vars:
    repo_root: "{{ playbook_dir }}/../.."

  tasks:
    - name: Consultar los nodos registrados en Headscale
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ compose_file }}"
          - exec
          - -T
          - headscale
          - headscale
          - nodes
          - list
        chdir: "{{ repo_root }}"
      register: headscale_nodes
      changed_when: false

    - name: Mostrar los nodos registrados
      ansible.builtin.debug:
        var: headscale_nodes.stdout_lines

    - name: Consultar el estado de los clientes Tailscale
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ compose_file }}"
          - exec
          - -T
          - "{{ item }}"
          - tailscale
          - status
          - --json
        chdir: "{{ repo_root }}"
      loop: "{{ overlay_nodes }}"
      register: tailscale_results
      changed_when: false

    - name: Mostrar el estado de cada cliente
      ansible.builtin.debug:
        msg:
          cliente: "{{ item.item }}"
          estado: "{{ (item.stdout | from_json).BackendState }}"
          ips: "{{ (item.stdout | from_json).TailscaleIPs }}"
          salud: "{{ (item.stdout | from_json).Health | default([]) }}"
      loop: "{{ tailscale_results.results }}"

    - name: Assert 4 nodos registrados en Headscale
      ansible.builtin.assert:
        that:
          - "'host-a1' in headscale_nodes.stdout"
          - "'host-a2' in headscale_nodes.stdout"
          - "'servidor-web' in headscale_nodes.stdout"
          - "'servidor-db' in headscale_nodes.stdout"
        fail_msg: >-
          Faltan nodos registrados en Headscale.
          Se esperan: host-a1, host-a2, servidor-web, servidor-db.
        success_msg: >-
          OK: 4 nodos registrados en Headscale.

    - name: Assert clientes Tailscale activos
      ansible.builtin.assert:
        that:
          - (item.stdout | from_json).BackendState == 'Running'
          - (item.stdout | from_json).Self.HostName == item.item
        fail_msg: >-
          Cliente Tailscale no activo en {{ item.item }}.
        success_msg: >-
          OK: Tailscale Running en {{ item.item }}.
      loop: "{{ tailscale_results.results }}"