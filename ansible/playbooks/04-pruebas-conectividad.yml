---
- name: Validar conectividad e aislamiento entre tenants
  hosts: controlador
  gather_facts: false

  vars_files:
    - ../vars/lab.yml

  vars:
    repo_root: "{{ playbook_dir }}/../.."

  tasks:
    - name: Esperar a que los túneles Tailscale se estabilicen
      ansible.builtin.command:
        argv:
          - sleep
          - "5"
      changed_when: false

    - name: Consultar las IPs Tailscale actuales de cada nodo overlay
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ compose_file }}"
          - exec
          - -T
          - "{{ item }}"
          - tailscale
          - ip
          - -4
        chdir: "{{ repo_root }}"
      loop: "{{ overlay_nodes }}"
      register: tailscale_ips
      changed_when: false

    - name: Validar las IPs Tailscale consultadas
      ansible.builtin.assert:
        that:
          - >-
            item.stdout | trim is
            match('^100\\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$')
        fail_msg: >-
          No se obtuvo una IP IPv4 válida de Tailscale para {{ item.item }}:
          {{ item.stdout | default('') }}
      loop: "{{ tailscale_ips.results }}"

    - name: Indexar las IPs Tailscale por nombre de nodo
      ansible.builtin.set_fact:
        overlay_ips: >-
          {{ overlay_ips | default({}) |
             combine({item.item: item.stdout | trim}) }}
      loop: "{{ tailscale_ips.results }}"

    - name: Diagnóstico - mostrar estado Tailscale de cada nodo overlay
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ compose_file }}"
          - exec
          - -T
          - "{{ item }}"
          - tailscale
          - status
        chdir: "{{ repo_root }}"
      loop: "{{ overlay_nodes }}"
      register: tailscale_status_diag
      changed_when: false

    - name: Mostrar diagnóstico Tailscale
      ansible.builtin.debug:
        var: tailscale_status_diag.results

    - name: "4.1 - Verificar conectividad dentro de tenant-a"
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ compose_file }}"
          - exec
          - -T
          - host-a1
          - tailscale
          - ping
          - --timeout=10s
          - "{{ overlay_ips['servidor-web'] }}"
        chdir: "{{ repo_root }}"
      register: ping_tenant_a
      changed_when: false
      failed_when: false

    - name: "Validar resultado positivo de tenant-a"
      ansible.builtin.assert:
        that:
          - ping_tenant_a.rc == 0
          - "'pong from' in (ping_tenant_a.stdout | lower)"
        fail_msg: >-
          FALLÓ la conectividad dentro de tenant-a.
          Revisar stdout y stderr de la prueba.
        success_msg: >-
          OK: host-a1 recibe respuesta de servidor-web.

    - name: "4.2 - Verificar conectividad dentro de tenant-b"
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ compose_file }}"
          - exec
          - -T
          - host-a2
          - tailscale
          - ping
          - --timeout=10s
          - "{{ overlay_ips['servidor-db'] }}"
        chdir: "{{ repo_root }}"
      register: ping_tenant_b
      changed_when: false
      failed_when: false

    - name: "Diagnóstico - resultado real de tenant-b"
      ansible.builtin.debug:
        msg:
          - "Código de salida (rc): {{ ping_tenant_b.rc | default('N/D') }}"
          - "STDOUT: {{ ping_tenant_b.stdout | default('') }}"
          - "STDERR: {{ ping_tenant_b.stderr | default('') }}"
          - "Comando ejecutado: {{ ping_tenant_b.cmd | default('N/D') }}"

    - name: "Validar resultado positivo de tenant-b"
      ansible.builtin.assert:
        that:
          - ping_tenant_b.rc == 0
          - "'pong from' in (ping_tenant_b.stdout | lower)"
        fail_msg: >-
          FALLÓ la conectividad dentro de tenant-b.
          Revisar stdout y stderr de la prueba.
        success_msg: >-
          OK: host-a2 recibe respuesta de servidor-db.

    - name: "4.3 - Verificar aislamiento desde tenant-a hacia tenant-b"
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ compose_file }}"
          - exec
          - -T
          - host-a1
          - tailscale
          - ping
          - --timeout=5s
          - "{{ overlay_ips['host-a2'] }}"
        chdir: "{{ repo_root }}"
      register: cross_a_to_b
      changed_when: false
      failed_when: false

    - name: "Validar evidencia de aislamiento A hacia B"
      ansible.builtin.assert:
        that:
          - >-
            'no matching peer' in
            ((cross_a_to_b.stdout ~ ' ' ~ cross_a_to_b.stderr) | lower)
        fail_msg: >-
          NO se confirmó el aislamiento A hacia B.
          Se esperaba el mensaje 'no matching peer'.
          Un timeout u otro error no se considera suficiente.
        success_msg: >-
          OK: el cliente de tenant-a no encuentra un peer
          de tenant-b, conforme al resultado esperado.

    - name: "4.4 - Verificar aislamiento desde tenant-b hacia tenant-a"
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ compose_file }}"
          - exec
          - -T
          - servidor-db
          - tailscale
          - ping
          - --timeout=5s
          - "{{ overlay_ips['servidor-web'] }}"
        chdir: "{{ repo_root }}"
      register: cross_b_to_a
      changed_when: false
      failed_when: false

    - name: "Diagnóstico - resultado real de aislamiento B hacia A"
      ansible.builtin.debug:
        msg:
          - "Código de salida (rc): {{ cross_b_to_a.rc | default('N/D') }}"
          - "STDOUT: {{ cross_b_to_a.stdout | default('') }}"
          - "STDERR: {{ cross_b_to_a.stderr | default('') }}"
          - "Comando ejecutado: {{ cross_b_to_a.cmd | default('N/D') }}"

    - name: "Validar evidencia de aislamiento B hacia A"
      ansible.builtin.assert:
        that:
          - >-
            'no matching peer' in
            ((cross_b_to_a.stdout ~ ' ' ~ cross_b_to_a.stderr) | lower)
        fail_msg: >-
          NO se confirmó el aislamiento B hacia A.
          Se esperaba el mensaje 'no matching peer'.
          Un timeout u otro error no se considera suficiente.
        success_msg: >-
          OK: el cliente de tenant-b no encuentra un peer
          de tenant-a, conforme al resultado esperado.

    - name: "Mostrar resumen de las cuatro pruebas"
      ansible.builtin.debug:
        msg:
          - "tenant-a: {{ ping_tenant_a.stdout | default('') }}"
          - "tenant-b: {{ ping_tenant_b.stdout | default('') }}"
          - >-
            tenant-a hacia tenant-b:
            {{ (cross_a_to_b.stdout ~ ' ' ~ cross_a_to_b.stderr) | trim }}
          - >-
            tenant-b hacia tenant-a:
            {{ (cross_b_to_a.stdout ~ ' ' ~ cross_b_to_a.stderr) | trim }}