
---
- name: Verificar el underlay L3 y BGP
  hosts: controlador
  connection: local
  gather_facts: false

  vars_files:
    - ../vars/lab.yml

  vars:
    repo_root: "{{ playbook_dir }}/../.."

  tasks:
    - name: Consultar el resumen BGP de cada router
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ compose_file }}"
          - exec
          - -T
          - "{{ item }}"
          - vtysh
          - -c
          - show bgp summary
        chdir: "{{ repo_root }}"
      loop: "{{ routers }}"
      register: bgp_results
      changed_when: false

    - name: Mostrar el resumen BGP
      ansible.builtin.debug:
        msg: |
          Router: {{ item.item }}
          {{ item.stdout }}
      loop: "{{ bgp_results.results }}"

    - name: Consultar las rutas IP de cada router
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ compose_file }}"
          - exec
          - -T
          - "{{ item }}"
          - vtysh
          - -c
          - show ip route
        chdir: "{{ repo_root }}"
      loop: "{{ routers }}"
      register: route_results
      changed_when: false

    - name: Mostrar las tablas de rutas
      ansible.builtin.debug:
        msg: |
          Router: {{ item.item }}
          {{ item.stdout }}
      loop: "{{ route_results.results }}"

    - name: Assert sesiones BGP establecidas
      ansible.builtin.assert:
        that:
          - "'Established' in item.stdout"
          - "'Active' not in item.stdout"
        fail_msg: >-
          BGP no Established en {{ item.item }}.
          Revisar 'show bgp summary'.
        success_msg: >-
          OK: BGP Established en {{ item.item }}.
      loop: "{{ bgp_results.results }}"

    - name: Assert router-a tiene ruta a 10.20.2.0/24
      ansible.builtin.assert:
        that:
          - "'10.20.2.0/24' in item.stdout"
        when: item.item == 'router-a'
        fail_msg: >-
          router-a no tiene ruta a 10.20.2.0/24 (sucursal B).
        success_msg: >-
          OK: router-a ruta hacia 10.20.2.0/24.
      loop: "{{ route_results.results }}"

    - name: Assert router-b tiene ruta a 10.10.1.0/24
      ansible.builtin.assert:
        that:
          - "'10.10.1.0/24' in item.stdout"
        when: item.item == 'router-b'
        fail_msg: >-
          router-b no tiene ruta a 10.10.1.0/24 (sucursal A).
        success_msg: >-
          OK: router-b ruta hacia 10.10.1.0/24.
      loop: "{{ route_results.results }}"
