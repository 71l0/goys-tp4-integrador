
---
- name: Verificar el underlay L3 y BGP
  hosts: controlador
  connection: local
  gather_facts: false

  vars_files:
    - ../vars/lab.yml

  vars:
    repo_root: "{{ playbook_dir }}/../.."

  tasks:
    - name: Consultar el resumen BGP estructurado de cada router
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ compose_file }}"
          - exec
          - -T
          - "{{ item }}"
          - vtysh
          - -c
          - show bgp summary json
        chdir: "{{ repo_root }}"
      loop: "{{ routers }}"
      register: bgp_results
      changed_when: false

    - name: Mostrar el resumen BGP
      ansible.builtin.debug:
        msg: |
          Router: {{ item.item }}
          {{ item.stdout }}
      loop: "{{ bgp_results.results }}"

    - name: Consultar las rutas IP de cada router
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ compose_file }}"
          - exec
          - -T
          - "{{ item }}"
          - vtysh
          - -c
          - show ip route
        chdir: "{{ repo_root }}"
      loop: "{{ routers }}"
      register: route_results
      changed_when: false

    - name: Mostrar las tablas de rutas
      ansible.builtin.debug:
        msg: |
          Router: {{ item.item }}
          {{ item.stdout }}
      loop: "{{ route_results.results }}"

    - name: Assert sesiones BGP establecidas
      ansible.builtin.assert:
        that:
          - (item.stdout | from_json).ipv4Unicast.peers | length > 0
          - >-
            (item.stdout | from_json).ipv4Unicast.peers.values()
            | selectattr('state', 'equalto', 'Established')
            | list | length ==
            (item.stdout | from_json).ipv4Unicast.peers | length
        fail_msg: >-
          Hay vecinos BGP no establecidos en {{ item.item }}.
          Revisar 'show bgp summary json'.
        success_msg: >-
          OK: BGP Established en {{ item.item }}.
      loop: "{{ bgp_results.results }}"

    - name: Assert router-a tiene ruta a 10.20.2.0/24
      ansible.builtin.assert:
        that:
          - "'10.20.2.0/24' in item.stdout"
        fail_msg: >-
          router-a no tiene ruta a 10.20.2.0/24 (sucursal B).
        success_msg: >-
          OK: router-a ruta hacia 10.20.2.0/24.
      when: item.item == 'router-a'
      loop: "{{ route_results.results }}"

    - name: Assert router-b tiene ruta a 10.10.1.0/24
      ansible.builtin.assert:
        that:
          - "'10.10.1.0/24' in item.stdout"
        fail_msg: >-
          router-b no tiene ruta a 10.10.1.0/24 (sucursal A).
        success_msg: >-
          OK: router-b ruta hacia 10.10.1.0/24.
      when: item.item == 'router-b'
      loop: "{{ route_results.results }}"