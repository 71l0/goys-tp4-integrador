global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: frr
    static_configs:
      - targets: ["10.100.0.31:9342"]
        labels: {router: router-a}
      - targets: ["10.100.0.32:9342"]
        labels: {router: router-b}
      - targets: ["10.100.0.33:9342"]
        labels: {router: router-c}

  - job_name: headscale
    static_configs:
      - targets: ["10.100.0.10:9090"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
