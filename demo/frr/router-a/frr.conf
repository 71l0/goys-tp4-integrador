frr defaults traditional
hostname router-a
log stdout
!
router bgp 65001
 bgp router-id 10.100.0.1
 no bgp ebgp-requires-policy
 neighbor 10.100.1.2 remote-as 65002
 neighbor 10.100.1.2 description Router-B-directo
 neighbor 10.100.1.2 timers 3 9
 neighbor 10.100.0.3 remote-as 65000
 neighbor 10.100.0.3 description Router-C
 neighbor 10.100.0.3 timers 3 9
 !
 address-family ipv4 unicast
  network 10.10.1.0/24
  neighbor 10.100.1.2 activate
  neighbor 10.100.0.3 activate
 exit-address-family
!
line vty