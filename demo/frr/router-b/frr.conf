frr defaults traditional
hostname router-b
log stdout
!
router bgp 65002
 bgp router-id 10.100.0.2
 no bgp ebgp-requires-policy
 neighbor 10.100.1.1 remote-as 65001
 neighbor 10.100.1.1 description Router-A-directo
 neighbor 10.100.1.1 timers 3 9
 neighbor 10.100.0.3 remote-as 65000
 neighbor 10.100.0.3 description Router-C
 neighbor 10.100.0.3 timers 3 9
 !
 address-family ipv4 unicast
  network 10.20.2.0/24
  neighbor 10.100.1.1 activate
  neighbor 10.100.0.3 activate
 exit-address-family
!
line vty