frr defaults traditional
hostname router-c
log stdout
!
router bgp 65000
 bgp router-id 10.100.0.3
 no bgp ebgp-requires-policy
 neighbor 10.100.0.1 remote-as 65001
 neighbor 10.100.0.1 description Router-A
 neighbor 10.100.0.1 timers 3 9
 neighbor 10.100.0.2 remote-as 65002
 neighbor 10.100.0.2 description Router-B
 neighbor 10.100.0.2 timers 3 9
 !
 address-family ipv4 unicast
  neighbor 10.100.0.1 activate
  neighbor 10.100.0.2 activate
 exit-address-family
!
line vty